[project]
name = "rag"
version = "0.1.0"
description = "A Python-based Retrieval-Augmented Generation application using LangChain, Sentence Transformers, and ChromaDB."
readme = "README.md"
authors = [
    { name = "ShubhCoder-17", email = "1705patrashubhadeep@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "pymupdf>=2.1",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
